# Kore configuration for Docker Compose. Copy to kore.toml and edit.
# docker-compose.yml mounts it read-only at /etc/kore/kore.toml.

# Inside the container the API must listen on all interfaces so Caddy can
# reach it over the internal Docker network; it is never published itself.
# Choose where Kore is reachable with KORE_BIND / KORE_PORT in .env instead.
port = 8080
bind = "0.0.0.0"

# The data dir inside the container. The host directory mounted here is
# KORE_DATA_DIR in .env (default /mnt/mirror/kore).
data_dir = "/data"

# First admin account, created on the first start. Kore refuses to start
# while the password is still "change-me" or shorter than 8 characters.
admin_email = "admin@example.com"
admin_password = "change-me"
