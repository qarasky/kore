name: kore-id ci

# Runs on pull requests, and (via images.yml) before anything is published from main or a tag.
on:
  pull_request:
    paths:
      - apps/kore-id/**
      - packages/kore-ui/**
      - package.json
      - bun.lock
      - bunfig.toml
      - turbo.json
      - .github/workflows/kore-id-ci.yml
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bunx turbo run typecheck test --filter=@kore/id

  web:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bunx turbo run typecheck test build --filter=@kore/id-web
