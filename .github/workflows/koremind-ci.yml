name: koremind ci

on:
  pull_request:
    paths:
      - apps/koremind/**
      - packages/kore-ui/**
      - package.json
      - bun.lock
      - bunfig.toml
      - turbo.json
      - .dockerignore
      - .github/workflows/koremind-*.yml
  push:
    branches: [main]
    paths:
      - apps/koremind/**
      - packages/kore-ui/**
      - package.json
      - bun.lock
      - bunfig.toml
      - turbo.json
      - .dockerignore
      - .github/workflows/koremind-*.yml
  workflow_call:

concurrency:
  group: koremind-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  server-and-web:
    name: Backend, shared and web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Tests (backend, shared, web, scripts)
        working-directory: apps/koremind
        run: bun test backend shared web scripts
      - name: Typecheck and build web
        run: bunx turbo run typecheck build --filter=@koremind/web
      - name: Versions agree
        working-directory: apps/koremind
        run: bun scripts/version.ts verify "$(bun scripts/version.ts show)"

  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and debug APK
        working-directory: apps/koremind/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-reports
          path: apps/koremind/android/app/build/reports/tests
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: koremind-debug-apk
          path: apps/koremind/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  docker:
    name: Docker images build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.image }} (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/koremind/${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=koremind-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=koremind-${{ matrix.image }}
