# Publishes Kore Drive's website (apps/kore-drive/docs) to GitHub Pages.
name: kore-drive pages

on:
  push:
    branches: [main]
    paths:
      - apps/kore-drive/docs/**
      - .github/workflows/kore-drive-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/kore-drive/docs
      - id: deployment
        uses: actions/deploy-pages@v5
