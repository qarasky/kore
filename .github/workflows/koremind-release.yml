# Cutting a release: bump the version, commit, tag.
#   cd apps/koremind && bun scripts/version.ts set 0.2.0 && git commit -am "release: koremind 0.2.0" \
#     && git tag koremind-v0.2.0 && git push origin main koremind-v0.2.0
# Pushing the tag verifies the version, runs the tests, publishes the Docker images and the signed APK,
# and creates the GitHub Release. See docs/releasing.md.
name: koremind release

on:
  push:
    tags:
      - "koremind-v[0-9]+.[0-9]+.[0-9]+"
      - "koremind-v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

# Steps run from the app's directory (scripts/, dist/).
defaults:
  run:
    working-directory: apps/koremind

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: The tag matches the version in every file
        run: bun scripts/version.ts verify "$GITHUB_REF_NAME"
      - name: The tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main. Merge first, then tag the merge commit."; exit 1; }
      - id: meta
        run: bun scripts/version.ts meta >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun test backend shared web scripts

  docker:
    name: Docker images
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/koremind-images.yml

  android:
    name: Android APK
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/koremind-android.yml
    secrets: inherit

  release:
    name: GitHub Release
    needs: [verify, docker, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: android-release
          path: apps/koremind/dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cat > notes-footer.md <<NOTES

          ## Install

          **Docker** (amd64 and arm64)
          \`\`\`
          docker pull ghcr.io/${owner}/koremind-backend:${VERSION}
          docker pull ghcr.io/${owner}/koremind-web:${VERSION}
          \`\`\`
          See \`apps/koremind/deploy/docker-compose.yml\` and \`apps/koremind/docs/deployment-docker.md\`.

          **Android**: download \`koremind-android-${VERSION}.apk\` below and install it. Check it with the \`.sha256\` file. Installed apps update themselves from here (Settings → Account → Updates).
          NOTES
          flags=(--verify-tag --generate-notes --notes-file notes-footer.md --title "KoreMind ${VERSION}")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
      # The app reads koremind-android.json from the rolling release koremind-android-latest: in the monorepo
      # the repository's "latest" release can belong to another app. Pre-releases never touch it.
      - name: Point installed apps at this release
        if: needs.verify.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rolling=koremind-android-latest
          if ! gh release view "$rolling" >/dev/null 2>&1; then
            gh release create "$rolling" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "KoreMind for Android: update manifest" \
              --notes "Installed KoreMind apps read koremind-android.json here to find the newest release. The APKs are on the koremind-v* releases."
          fi
          gh release upload "$rolling" dist/koremind-android.json --clobber
