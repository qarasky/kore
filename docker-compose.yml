# Kore: Caddy (the only published service) -> web (Next.js) and api (Go).
# Configure with .env only (see .env.example). Install: install.sh or README.md.
# Images come from ghcr.io; `docker compose build` builds them from source.
name: kore

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${KORE_BIND:-127.0.0.1}:${KORE_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    environment:
      # Trusted proxy range in the Caddyfile: must match networks.edge.
      KORE_SUBNET: ${KORE_SUBNET:-172.31.255.0/24}
    tmpfs:
      - /data
      - /config
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [edge, internal]
    # Caddy drains for up to 30 s (grace_period in the Caddyfile).
    stop_grace_period: 40s
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    image: ghcr.io/qarasky/kore-web:${KORE_VERSION:-latest}
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    tmpfs:
      - /tmp
      - /app/.next/cache
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  api:
    build: ./api
    image: ghcr.io/qarasky/kore-api:${KORE_VERSION:-latest}
    restart: unless-stopped
    # Files in the data dir are created as this host user (e.g. `office`).
    user: "${KORE_UID:-1000}:${KORE_GID:-1000}"
    environment:
      # Inside the container: listen on all interfaces (only Caddy reaches
      # it, over the internal network) and keep data in /data. Where Kore is
      # reachable on the host is KORE_BIND/KORE_PORT, used by caddy above.
      KORE_BIND: 0.0.0.0
      KORE_PORT: "8080"
      KORE_DATA_DIR: /data
      # First admin account, created on the first start.
      KORE_ADMIN_EMAIL: ${KORE_ADMIN_EMAIL:?set KORE_ADMIN_EMAIL in .env}
      KORE_ADMIN_PASSWORD: ${KORE_ADMIN_PASSWORD:?set KORE_ADMIN_PASSWORD in .env}
    volumes:
      # Never auto-created: if the volume is not mounted, compose fails
      # instead of writing into an empty directory on the root disk.
      - type: bind
        source: ${KORE_DATA_DIR:?set KORE_DATA_DIR in .env}
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [internal]
    # In-flight requests get 30 s to finish on `docker compose stop/down`.
    stop_grace_period: 40s
    logging: *logging

networks:
  # Only Caddy is on a network with a published port. Its fixed subnet is
  # what the Caddyfile trusts (connections from the Docker host arrive from
  # its gateway); change KORE_SUBNET in .env if it collides with a network
  # you already use.
  edge:
    ipam:
      config:
        - subnet: ${KORE_SUBNET:-172.31.255.0/24}
  # api and web: no published ports and no outbound internet access.
  internal:
    internal: true
