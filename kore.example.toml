# Kore configuration for running the binary directly (`kore -config kore.toml`).
# Copy to kore.toml and edit. For Docker Compose use kore.docker.example.toml.

# Port to listen on (default 8080).
# port = 8080

# Address to bind (default 127.0.0.1; use 0.0.0.0 for all interfaces).
# bind = "127.0.0.1"

# Directory for the database and stored files (required).
data_dir = "./data"

# First admin account (required), created on the first start. Kore refuses
# to start while the password is still "change-me" or shorter than 8 characters.
admin_email = "admin@example.com"
admin_password = "change-me"

# --- Sign in with Kore ID (OpenID Connect; optional) ---
# Public address of Kore, no trailing slash. The redirect URI to register at
# Kore ID is public_url + "/api/auth/oidc/callback"; also register
# public_url + "/login" as a post-logout redirect URI.
# public_url = "https://kore.example.com"
# Set false to disable email + password login (needs [oidc]). Default true.
# local_login = true

# [oidc]
# issuer = "https://id.example.com"    # setting it enables Kore ID
# client_id = "kore"
# client_secret = ""                   # or KORE_OIDC_CLIENT_SECRET
# auto_provision = true                # create accounts on first login
# link_by_email = false                # see README before enabling
# All of these also exist as KORE_PUBLIC_URL, KORE_LOCAL_LOGIN, KORE_OIDC_ISSUER,
# KORE_OIDC_CLIENT_ID, KORE_OIDC_CLIENT_SECRET, KORE_OIDC_AUTO_PROVISION and
# KORE_OIDC_LINK_BY_EMAIL (the environment wins over the file).
